[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "score-tracker"
version = "0.4.0"
description = "Desktop app that reads Umamusume Team Trials results and tracks team and character averages"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24",
    "PySide6>=6.6",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

# A GUI script: on Windows it starts without a console window
[project.gui-scripts]
score-tracker = "score_tracker.gui.app:run"

[tool.setuptools]
packages = ["score_tracker", "score_tracker.gui"]

[tool.setuptools.package-data]
score_tracker = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
