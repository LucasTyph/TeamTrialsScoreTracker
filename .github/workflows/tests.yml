name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Tesseract isn't installed on the runner, so the real-screenshot
      # tests are skipped here; run them locally with `python -m pytest`.
      - name: Test
        run: python -m pytest -rs
